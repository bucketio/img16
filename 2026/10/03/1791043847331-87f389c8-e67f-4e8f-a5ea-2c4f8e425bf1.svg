<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 708" width="760" height="708">
<defs>
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
  <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C2410C"/><stop offset="100%" stop-color="#FB923C"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#15803D"/><stop offset="100%" stop-color="#4ADE80"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6D28D9"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#94A3B8"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0F766E"/><stop offset="100%" stop-color="#2DD4BF"/></linearGradient>
  <filter id="shadowSm"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#64748B" flood-opacity="0.12"/></filter>
  <marker id="arr_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/></marker>
  <marker id="arr_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker>
  <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker>
  <marker id="arr_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F97316"/></marker>
  <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker>
</defs>
<rect width="760" height="708" fill="#F8FAFC"/>
<text x="380" y="48" font-size="26" font-weight="800" fill="#0F172A" text-anchor="middle">窗口越满,手越重</text>
<text x="380" y="76" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">按窗口占用从低到高,OpenClaw 依次动用的手段</text>
<rect x="60" y="128" width="640" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="60.0" y="128" width="192.0" height="46" fill="#F0FDF4"/>
<text x="156.0" y="156" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">不动</text>
<rect x="252.0" y="128" width="128.0" height="46" fill="#FEF9C3"/>
<text x="316.0" y="156" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">soft-trim</text>
<rect x="380.0" y="128" width="256.0" height="46" fill="#FFEDD5"/>
<text x="508.0" y="156" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">hard-clear</text>
<rect x="636.0" y="128" width="64.0" height="46" fill="#FEE2E2"/>
<text x="668.0" y="156" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">压缩</text>
<rect x="60" y="128" width="640" height="46" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="252.0" y1="118" x2="252.0" y2="184" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="252.0" y="108" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">30%</text>
<line x1="380.0" y1="118" x2="380.0" y2="184" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="380.0" y="108" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">50%</text>
<line x1="636.0" y1="118" x2="636.0" y2="184" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="636.0" y="108" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">窗口减预留</text>
<line x1="700.0" y1="118" x2="700.0" y2="184" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="700.0" y="108" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">100%</text>
<text x="380" y="206" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="middle">窗口占用 →</text>
<rect x="40" y="226" width="680" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<rect x="40" y="226" width="130" height="66" rx="12" fill="#FEF9C3" stroke="#FDE047" stroke-width="1.5"/>
<text x="105" y="264" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">窗口 30% 起</text>
<text x="188" y="254" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">soft-trim(本地裁剪)</text>
<text x="188" y="276" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">缓存 TTL 过后,超过 4000 字符的旧工具结果只留头尾各 1500 字符</text>
<rect x="40" y="304" width="680" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<rect x="40" y="304" width="130" height="66" rx="12" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1.5"/>
<text x="105" y="342" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">窗口 50% 起</text>
<text x="188" y="332" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">hard-clear(本地裁剪)</text>
<text x="188" y="354" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">旧工具结果合计 ≥ 5 万字符时,换成占位符,直到降到 50% 以下</text>
<rect x="40" y="382" width="680" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<rect x="40" y="382" width="130" height="66" rx="12" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
<text x="105" y="420" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">窗口减预留</text>
<text x="188" y="410" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">压缩</text>
<text x="188" y="432" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">预留默认 20,000 token;把旧对话写成摘要,最近的原文留着</text>
<rect x="40" y="460" width="680" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<rect x="40" y="460" width="130" height="66" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
<text x="105" y="498" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">溢出报错</text>
<text x="188" y="488" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">压缩后重试</text>
<text x="188" y="510" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">模型报上下文溢出,先压缩再重试,最多 3 次</text>
<rect x="40" y="552" width="680" height="132" rx="12" fill="#0F172A" stroke="#0F172A" stroke-width="1" filter="url(#shadowSm)"/>
<text x="64" y="582" font-size="14" font-weight="700" fill="#FBBF24" text-anchor="start">两点说明</text>
<text x="64" y="610" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">上面前两档是本地裁剪。直连 Anthropic API key 时,裁剪交给服务端:</text>
<text x="64" y="632" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">超过 max(5 万 token, 窗口 30%) 就清,只留最近 3 个工具调用。</text>
<text x="64" y="654" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">百分比是示意位置,压缩那条线的实际位置取决于窗口大小。</text>
</svg>
