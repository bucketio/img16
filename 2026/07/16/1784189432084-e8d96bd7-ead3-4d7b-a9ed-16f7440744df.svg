<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f4ff"/><stop offset="1" stop-color="#e8f0fe"/></linearGradient>
  </defs>
  <rect width="940" height="400" fill="url(#bg2)"/>
  
  <!-- Puzzle pieces scattered -->
  <g opacity="0.15">
    <path d="M680,80 l60,0 l0,40 l-15,-5 l-15,5 l0,-15 l-30,0 z" fill="#1a6bff"/>
    <path d="M750,150 l50,0 l0,35 l-12,-4 l-13,4 l0,-12 l-25,0 z" fill="#ff6b35"/>
    <path d="M700,220 l55,0 l0,30 l-10,-3 l-12,3 l0,-10 l-33,0 z" fill="#2e7d32"/>
    <path d="M760,290 l45,0 l0,25 l-8,-3 l-10,3 l0,-8 l-27,0 z" fill="#5b6abf"/>
    
    <path d="M80,300 l60,0 l0,40 l-15,-5 l-15,5 l0,-15 l-30,0 z" fill="#1a6bff" opacity="0.5"/>
    <path d="M170,340 l50,0 l0,30 l-12,-4 l-13,4 l0,-12 l-25,0 z" fill="#ff6b35" opacity="0.5"/>
  </g>
  
  <!-- Connecting lines between pieces (AI integration) -->
  <line x1="130" y1="340" x2="680" y2="100" stroke="#1a6bff" stroke-width="1.5" opacity="0.2" stroke-dasharray="6,4"/>
  <line x1="200" y1="355" x2="750" y2="170" stroke="#1a6bff" stroke-width="1.5" opacity="0.15" stroke-dasharray="6,4"/>
  <line x1="680" y1="100" x2="750" y2="170" stroke="#1a6bff" stroke-width="1.5" opacity="0.2" stroke-dasharray="6,4"/>
  
  <!-- Series label -->
  <rect x="35" y="30" width="115" height="28" rx="14" fill="#1a6bff" opacity="0.85"/>
  <text x="92" y="49" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#fff">深度连载第1篇</text>
  
  <!-- Main title -->
  <text x="50" y="115" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="30" font-weight="bold" fill="#1e293b">全过程咨询的</text>
  <text x="50" y="155" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="30" font-weight="bold" fill="#1e293b">碎片化困局</text>
  
  <!-- Subtitle -->
  <text x="50" y="198" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#64748b">从「各管一段」到「全过程一体化」</text>
  
  <!-- Divider -->
  <line x1="50" y1="218" x2="200" y2="218" stroke="#1a6bff" stroke-width="2"/>
  
  <!-- Key data -->
  <text x="50" y="255" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#94a3b8">核心问题：信息孤岛 · 经验依赖 · 协同低效 · 标准缺失</text>
  
  <!-- Brand -->
  <text x="50" y="365" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#94a3b8">深度内容 · 每周一更新</text>
  <text x="890" y="365" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#94a3b8">清源智界研究院</text>
</svg>
