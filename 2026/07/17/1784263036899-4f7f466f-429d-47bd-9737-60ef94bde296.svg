<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f7ff"/><stop offset="0.5" stop-color="#e0f2fe"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="arrowGrad4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a6bff"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  </defs>
  
  <rect width="940" height="400" fill="url(#bg4)"/>
  
  <!-- Speed lines background -->
  <g opacity="0.07">
    <line x1="300" y1="60" x2="900" y2="60" stroke="#1a6bff" stroke-width="2"/>
    <line x1="280" y1="100" x2="920" y2="100" stroke="#1a6bff" stroke-width="1.5"/>
    <line x1="260" y1="140" x2="910" y2="140" stroke="#1a6bff" stroke-width="3"/>
    <line x1="290" y1="260" x2="920" y2="260" stroke="#1a6bff" stroke-width="3"/>
    <line x1="270" y1="300" x2="900" y2="300" stroke="#1a6bff" stroke-width="1.5"/>
    <line x1="300" y1="340" x2="910" y2="340" stroke="#1a6bff" stroke-width="2"/>
  </g>
  
  <!-- Accent circle -->
  <circle cx="850" cy="80" r="100" fill="#1a6bff" opacity="0.03"/>
  <circle cx="100" cy="350" r="80" fill="#ff6b35" opacity="0.03"/>
  
  <!-- Badge -->
  <rect x="30" y="25" width="100" height="26" rx="13" fill="#1a6bff"/>
  <text x="80" y="42" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#fff">深度连载</text>
  
  <!-- Main headline -->
  <text x="50" y="150" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="48" font-weight="bold" fill="#1e293b">从3天到1小时</text>
  
  <!-- 3天 crossed out -->
  <text x="50" y="245" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="40" fill="#94a3b8">3天</text>
  <line x1="45" y1="220" x2="163" y2="250" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Arrow -->
  <line x1="170" y1="240" x2="280" y2="240" stroke="url(#arrowGrad4)" stroke-width="4"/>
  <polygon points="280,232 305,240 280,248" fill="#1a6bff"/>
  
  <!-- 1 hour -->
  <text x="315" y="245" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="40" font-weight="bold" fill="#1a6bff">1小时</text>
  
  <!-- Badge -->
  <rect x="430" y="220" width="100" height="38" rx="19" fill="#ff6b35"/>
  <text x="480" y="246" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#fff">提效90%</text>
  
  <!-- Subtitle -->
  <text x="50" y="310" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#64748b">獴探·智写重新定义可研报告撰写</text>
  
  <!-- Brand -->
  <text x="910" y="370" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#94a3b8" opacity="0.7">清源智界 · 獴探</text>
</svg>
