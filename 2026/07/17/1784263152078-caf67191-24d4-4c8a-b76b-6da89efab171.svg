<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1628"/><stop offset="0.4" stop-color="#142442"/><stop offset="1" stop-color="#1a365d"/></linearGradient>
    <linearGradient id="warmLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd700" stop-opacity="0.12"/><stop offset="1" stop-color="#ffd700" stop-opacity="0"/></linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1a6bff" stop-opacity="0.15"/><stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.08"/><stop offset="1" stop-color="#1a6bff" stop-opacity="0"/></linearGradient>
  </defs>
  
  <!-- Base -->
  <rect width="940" height="400" fill="url(#bg1)"/>
  
  <!-- Warm light from desk lamp -->
  <polygon points="750,140 680,400 880,400" fill="url(#warmLight)"/>
  <circle cx="750" cy="140" r="60" fill="#ffd700" opacity="0.06"/>
  
  <!-- Data dots decoration -->
  <g opacity="0.15">
    <circle cx="120" cy="80" r="2" fill="#60a5fa"/>
    <circle cx="180" cy="120" r="1.5" fill="#60a5fa"/>
    <circle cx="200" cy="65" r="2.5" fill="#60a5fa"/>
    <circle cx="260" cy="100" r="1.5" fill="#60a5fa"/>
    <circle cx="150" cy="150" r="1" fill="#60a5fa"/>
    <circle cx="300" cy="55" r="2" fill="#60a5fa"/>
    <circle cx="350" cy="130" r="1.5" fill="#60a5fa"/>
    <circle cx="400" cy="70" r="2" fill="#60a5fa"/>
    <circle cx="450" cy="140" r="1" fill="#60a5fa"/>
    <circle cx="500" cy="90" r="2" fill="#60a5fa"/>
    <circle cx="550" cy="50" r="1.5" fill="#60a5fa"/>
    <circle cx="600" cy="110" r="2" fill="#60a5fa"/>
    <circle cx="650" cy="70" r="1" fill="#60a5fa"/>
    <!-- Connecting lines -->
    <line x1="120" y1="80" x2="200" y2="65" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="200" y1="65" x2="300" y2="55" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="300" y1="55" x2="400" y2="70" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="400" y1="70" x2="500" y2="90" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="500" y1="90" x2="650" y2="70" stroke="#60a5fa" stroke-width="0.5"/>
  </g>
  
  <!-- Blue accent diagonal -->
  <rect x="0" y="0" width="940" height="400" fill="url(#blueAccent)"/>
  
  <!-- Desk -->
  <rect x="0" y="300" width="940" height="100" fill="#0a0f1a" opacity="0.6"/>
  <rect x="80" y="310" width="780" height="6" rx="2" fill="#5c3a1e" opacity="0.3"/>
  
  <!-- Screen glow -->
  <rect x="200" y="250" width="180" height="60" rx="3" fill="#1a6bff" opacity="0.04"/>
  
  <!-- Coffee cup -->
  <rect x="740" y="300" width="22" height="18" rx="2" fill="#ddd" opacity="0.08"/>
  <path d="M762,306 q5,0 5,5 q0,5 -5,5" fill="none" stroke="#ddd" stroke-width="1.5" opacity="0.08"/>
  <ellipse cx="751" cy="300" rx="11" ry="3" fill="#8B4513" opacity="0.15"/>
  
  <!-- Badge -->
  <rect x="30" y="25" width="80" height="26" rx="13" fill="#1a6bff"/>
  <text x="70" y="42" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#fff">发刊词</text>
  
  <!-- Title -->
  <text x="50" y="170" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="44" font-weight="bold" fill="#ffffff">凌晨三点，</text>
  <text x="50" y="230" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="44" font-weight="bold" fill="#ffffff">一份可研报告的效率真相</text>
  
  <!-- Decorative line under title -->
  <rect x="50" y="248" width="60" height="3" rx="1.5" fill="#1a6bff"/>
  
  <!-- Brand -->
  <text x="910" y="370" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#64748b" opacity="0.7">清源智界 · 獴探</text>
</svg>
