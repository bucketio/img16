<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740">
  <title>Warlock 人在回路控制链路总体架构</title>
  <desc>从 SDL 摇杆与键盘输入,经 GUI 线程组装操纵数据、SimCommand 无锁队列、仿真线程消费,最终注入飞行员对象的完整控制链路,以及脚本通道与本地 UI 通道两条旁路。</desc>

  <!-- 背景 -->
  <rect x="0" y="0" width="680" height="740" fill="#ffffff"/>

  <!-- 线程泳道背景 -->
  <rect x="16" y="16" width="648" height="166" rx="10" fill="#fafbfc" stroke="#e0e3e7" stroke-width="1"/>
  <rect x="16" y="316" width="648" height="402" rx="10" fill="#fafbfc" stroke="#e0e3e7" stroke-width="1"/>
  <text x="34" y="42" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#8a9199">GUI 线程(生产侧)</text>
  <text x="34" y="340" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#8a9199">仿真线程(消费侧)</text>
  <text x="34" y="358" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#8a9199">30 Hz ClockEvent</text>

  <!-- 1. 输入设备 -->
  <rect x="180" y="58" width="320" height="52" rx="10" fill="#eef4f9" stroke="#1d5f8a" stroke-width="1.2"/>
  <text x="340" y="80" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2328">SDL 摇杆 / 键盘</text>
  <text x="340" y="99" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#4a5158">XML 设备映射 · 轴 [-1,1] / 按键 / 多机制求和</text>

  <!-- 箭头 1→2 -->
  <line x1="340" y1="110" x2="340" y2="132" stroke="#9aa3ac" stroke-width="1.5"/>
  <polygon points="340,138 336,130 344,130" fill="#9aa3ac"/>

  <!-- 2. 权限门控 -->
  <rect x="180" y="138" width="320" height="40" rx="8" fill="#ffffff" stroke="#e0e3e7" stroke-width="1"/>
  <text x="340" y="155" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#4a5158">权限门控 HasPermissionToControlPlatform</text>
  <text x="340" y="171" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#8a9199">队伍限制 × 平台名单(默认全部可控)</text>

  <!-- 箭头 2→3 -->
  <line x1="340" y1="178" x2="340" y2="192" stroke="#9aa3ac" stroke-width="1.5"/>
  <polygon points="340,198 336,190 344,190" fill="#9aa3ac"/>

  <!-- 3. GUI 组装 -->
  <rect x="180" y="198" width="320" height="104" rx="10" fill="#eef4f9" stroke="#1d5f8a" stroke-width="1.2"/>
  <text x="340" y="222" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Joystick 插件 GuiUpdate()</text>
  <text x="340" y="242" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#4a5158">组装 ControlData:roll / pitch / rudder</text>
  <text x="340" y="261" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#4a5158">throttle / 减速板 / 起落架 / 配平 × 3</text>
  <text x="340" y="286" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#8a9199">JoystickPlugin.cpp:143-302</text>

  <!-- 箭头 3→4 -->
  <line x1="340" y1="302" x2="340" y2="316" stroke="#9aa3ac" stroke-width="1.5"/>
  <polygon points="340,322 336,314 344,314" fill="#9aa3ac"/>

  <!-- 4. 无锁队列 -->
  <rect x="180" y="322" width="320" height="64" rx="10" fill="#ffffff" stroke="#1d5f8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="340" y="345" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1d5f8a">SimCommand 无锁队列</text>
  <text x="340" y="364" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#4a5158">AddSimCommand · UtConcurrentQueue</text>
  <text x="340" y="380" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#4a5158">GUI 生产 · 仿真消费</text>

  <!-- 箭头 4→5 -->
  <line x1="340" y1="386" x2="340" y2="400" stroke="#9aa3ac" stroke-width="1.5"/>
  <polygon points="340,406 336,398 344,398" fill="#9aa3ac"/>

  <!-- 5. 命令分发 -->
  <rect x="180" y="406" width="320" height="72" rx="10" fill="#eef4f9" stroke="#1d5f8a" stroke-width="1.2"/>
  <text x="340" y="430" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2328">ControlCommand::Process()</text>
  <text x="340" y="450" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#4a5158">按 P6DOF / SixDOF 分支取活跃手动飞行员</text>
  <text x="340" y="468" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#8a9199">JoystickSimCommands.cpp:37-364</text>

  <!-- 箭头 5→6 -->
  <line x1="340" y1="478" x2="340" y2="492" stroke="#9aa3ac" stroke-width="1.5"/>
  <polygon points="340,498 336,490 344,490" fill="#9aa3ac"/>

  <!-- 6. 接管序列 -->
  <rect x="180" y="498" width="320" height="52" rx="10" fill="#ffffff" stroke="#e0e3e7" stroke-width="1"/>
  <text x="340" y="519" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">接管序列(每拍重复)</text>
  <text x="340" y="538" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#4a5158">EnableControls → 关自驾 → TakeManualControl</text>

  <!-- 箭头 6→7 -->
  <line x1="340" y1="550" x2="340" y2="564" stroke="#9aa3ac" stroke-width="1.5"/>
  <polygon points="340,570 336,562 344,562" fill="#9aa3ac"/>

  <!-- 7. 飞行员对象注入 -->
  <rect x="180" y="570" width="320" height="72" rx="10" fill="#eef4f9" stroke="#1d5f8a" stroke-width="1.6"/>
  <text x="340" y="594" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1d5f8a">飞行员对象 SetManualControlData</text>
  <text x="340" y="614" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#4a5158">8 参:杆 / 舵 / 油门 [0,2] / 减速板 / 扰流板 / 襟翼 / 起落架</text>
  <text x="340" y="632" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#8a9199">配平为 Δt 增量语义,由持续时间积分</text>

  <!-- 箭头 7→8 -->
  <line x1="340" y1="642" x2="340" y2="656" stroke="#9aa3ac" stroke-width="1.5"/>
  <polygon points="340,662 336,654 344,654" fill="#9aa3ac"/>

  <!-- 8. 底层执行 -->
  <rect x="180" y="662" width="320" height="48" rx="10" fill="#ffffff" stroke="#e0e3e7" stroke-width="1"/>
  <text x="340" y="682" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">控制增稳(CAS)→ 舵面 / 油门</text>
  <text x="340" y="700" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#8a9199">CAS 包线:滚转 180°/s · 俯仰 8 g</text>

  <!-- 右侧旁路:脚本通道 -->
  <rect x="520" y="406" width="144" height="124" rx="10" fill="#fafbfc" stroke="#e0e3e7" stroke-width="1"/>
  <text x="592" y="430" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1d5f8a">脚本通道</text>
  <text x="592" y="450" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#4a5158">武器 / 传感器 / EW</text>
  <text x="592" y="468" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#4a5158">ScriptExecuteCommand</text>
  <text x="592" y="486" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#4a5158">入同一命令队列</text>
  <text x="592" y="504" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#8a9199">外控平台转 XIO 报文</text>
  <text x="592" y="520" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#8a9199">WsfXIO_ScriptExecutePkt</text>

  <!-- 右侧旁路:本地 UI 通道 -->
  <rect x="520" y="570" width="144" height="124" rx="10" fill="#fafbfc" stroke="#e0e3e7" stroke-width="1"/>
  <text x="592" y="594" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1d5f8a">本地 UI 通道</text>
  <text x="592" y="614" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#4a5158">HUD 模式切换</text>
  <text x="592" y="632" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#4a5158">目标指定十字线</text>
  <text x="592" y="650" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#4a5158">雷达最近邻锁定</text>
  <text x="592" y="672" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#8a9199">GUI 侧处理</text>
  <text x="592" y="688" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#8a9199">不进入仿真回路</text>
</svg>
